<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Folk — Professional Photo Editor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Toolbar -->
        <header class="top-bar">
            <div class="brand">
                <h1>FRAME FOLK</h1>
                <span class="slogan">Timeless Tales of Togetherness</span>
            </div>
            <div class="top-actions">
                <input type="file" id="imageLoader" accept="image/*" hidden>
                <button id="uploadBtn" class="btn primary"><i class="fas fa-upload"></i> Upload</button>
                <button id="undoBtn" class="btn" title="Undo" disabled><i class="fas fa-undo"></i></button>
                <button id="redoBtn" class="btn" title="Redo" disabled><i class="fas fa-redo"></i></button>
                <button id="resetBtn" class="btn" title="Reset All"><i class="fas fa-sync-alt"></i> Reset</button>
                <button id="compareBtn" class="btn" title="Hold to Compare"><i class="fas fa-columns"></i> Before/After</button>
                <button id="exportBtn" class="btn accent"><i class="fas fa-download"></i> Export JPG</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="main-workspace">
            <!-- Left / Center Canvas Area -->
            <div class="canvas-container">
                <div id="dropZone" class="drop-zone">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <h3>Drag & Drop your photo here</h3>
                    <p>or click Upload to start editing</p>
                    <button class="btn primary" onclick="document.getElementById('imageLoader').click()">Browse Photo</button>
                </div>
                <canvas id="imageCanvas" class="hidden"></canvas>
            </div>

            <!-- Right Sidebar Controls -->
            <aside class="sidebar">
                <div class="tabs">
                    <button class="tab-btn active" data-target="lightPanel"><i class="fas fa-sun"></i> Light</button>
                    <button class="tab-btn" data-target="colorPanel"><i class="fas fa-palette"></i> Color</button>
                    <button class="tab-btn" data-target="effectsPanel"><i class="fas fa-magic"></i> Effects</button>
                    <button class="tab-btn" data-target="transformPanel"><i class="fas fa-crop"></i> Transform</button>
                </div>

                <div class="panel-content">
                    <!-- Light Panel -->
                    <div id="lightPanel" class="control-panel active">
                        <h3>Light Adjustments</h3>
                        <div class="control-group">
                            <label>Exposure <span id="exposureVal">0</span></label>
                            <input type="range" id="exposure" min="-100" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Contrast <span id="contrastVal">0</span></label>
                            <input type="range" id="contrast" min="-100" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Highlights <span id="highlightsVal">0</span></label>
                            <input type="range" id="highlights" min="-100" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Shadows <span id="shadowsVal">0</span></label>
                            <input type="range" id="shadows" min="-100" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Whites <span id="whitesVal">0</span></label>
                            <input type="range" id="whites" min="-100" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Blacks <span id="blacksVal">0</span></label>
                            <input type="range" id="blacks" min="-100" max="100" value="0">
                        </div>
                    </div>

                    <!-- Color Panel -->
                    <div id="colorPanel" class="control-panel">
                        <h3>Color & Tone</h3>
                        <div class="control-group">
                            <label>Temperature <span id="tempVal">0</span></label>
                            <input type="range" id="temp" min="-100" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Tint <span id="tintVal">0</span></label>
                            <input type="range" id="tint" min="-100" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Saturation <span id="saturationVal">0</span></label>
                            <input type="range" id="saturation" min="-100" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Vibrance <span id="vibranceVal">0</span></label>
                            <input type="range" id="vibrance" min="-100" max="100" value="0">
                        </div>
                    </div>

                    <!-- Effects Panel -->
                    <div id="effectsPanel" class="control-panel">
                        <h3>Effects & Texture</h3>
                        <div class="control-group">
                            <label>Clarity <span id="clarityVal">0</span></label>
                            <input type="range" id="clarity" min="-100" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Vignette <span id="vignetteVal">0</span></label>
                            <input type="range" id="vignette" min="0" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Grain <span id="grainVal">0</span></label>
                            <input type="range" id="grain" min="0" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>Sharpen <span id="sharpenVal">0</span></label>
                            <input type="range" id="sharpen" min="0" max="100" value="0">
                        </div>
                    </div>

                    <!-- Transform Panel -->
                    <div id="transformPanel" class="control-panel">
                        <h3>Transform & Crop</h3>
                        <div class="button-grid">
                            <button id="rotateLeftBtn" class="btn"><i class="fas fa-undo"></i> Rotate Left</button>
                            <button id="rotateRightBtn" class="btn"><i class="fas fa-redo"></i> Rotate Right</button>
                            <button id="flipHBtn" class="btn"><i class="fas fa-arrows-alt-h"></i> Flip H</button>
                            <button id="flipVBtn" class="btn"><i class="fas fa-arrows-alt-v"></i> Flip V</button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
